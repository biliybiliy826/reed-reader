[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reed-reader"
version = "0.2.1"
description = "苇读 — Linux 摸鱼阅读器：透明文字悬浮、一键隐藏，支持微信读书"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "Reed Reader contributors"}]
dependencies = [
  "PySide6-Essentials>=6.12,<7",
  "PySide6-WebEngine>=6.12,<7",
  "charset-normalizer>=3.4,<4",
  "defusedxml>=0.7,<1",
  "mobi==0.4.1",
  "python-xlib>=0.33,<1; sys_platform == 'linux'",
]

[project.scripts]
reed-reader = "reed_reader.app:main"

[project.urls]
Homepage = "https://github.com/biliybiliy826/reed-reader"
Repository = "https://github.com/biliybiliy826/reed-reader"
Issues = "https://github.com/biliybiliy826/reed-reader/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.11", "build>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/reed_reader"]
